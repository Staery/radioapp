name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libmimalloc-dev
      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          mkdir -p dist
          case "${{ matrix.target }}" in
            android)
              flutter build apk --release
              cp build/app/outputs/flutter-apk/app-release.apk "dist/RadioApp-v$VERSION-android.apk" ;;
            linux)
              flutter build linux --release
              tar -czf "dist/RadioApp-v$VERSION-linux-x64.tar.gz" -C build/linux/x64/release bundle ;;
            web)
              flutter build web --release --no-web-resources-cdn
              (cd build/web && zip -qr "../../dist/RadioApp-v$VERSION-web.zip" .) ;;
            windows)
              flutter build windows --release
              7z a "dist/RadioApp-v$VERSION-windows-x64.zip" ./build/windows/x64/runner/Release/* ;;
            macos)
              flutter build macos --release
              ditto -c -k --keepParent build/macos/Build/Products/Release/Radio.app "dist/RadioApp-v$VERSION-macos.zip" ;;
            ios)
              # Unsigned: sign it with your own Apple developer account to install.
              flutter build ios --release --no-codesign
              mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
              zip -qr "dist/RadioApp-v$VERSION-ios-unsigned.ipa" Payload ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: radioapp-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
